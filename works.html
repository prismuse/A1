<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <!-- Google Fonts Link -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

        <meta name="author" content="Nokutenda Tiffany Chavura" />
        <meta name="description" content="portfolio works">
        <meta name="keywords" content="student, ideas, work">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Works</title>  
    </head>

<body>

    <!-- <header> is used instead of <div> because it specifically tells browsers that this is 
      introductory information for the 'works' page not body content. -->
    <header>
        <img src="images/profile_pic.png" alt="Profile Picture">

        <!-- <nav> is used over <div> to tell browsers that the links inside are for
         navigating the site, screen readers can jump straight into it. -->
        <nav> 
            <a href="index.html">Home</a>
            <a href="works.html">Works</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    
    <!-- <main> is used over <div> to indicate a single, primary content area of the 'works' page, 
        not like any other content on the page-->
    <main>
        <h1>Projects</h1>

        <!-- <article> is used over <section> or <div> to show independently meaningful
         information that would still make sense if it was pulled out and placed on its own
         the other tags do not have this self-contained quality -->
        <article>
            <!-- <header> is nested in <article> as this content has distinct information seperate from
                the pages overall header-->
            <header>
                <h2>Quollie App</h2>
                <div class="project-gallery">
                    <img src="images/Quollie Profile.jpg" alt="Quollie profile page">
                    <img src="images/Quollie Feed page.jpg" alt="Quollie feed page">
                </div>
            </header>
            <p>Content</p>
        </article>

        <article>
            <!-- <header> is nested in <article> as this content has distinct information seperate from
                the pages overall header-->
            <header>               
                <h2>Wandr Travel App</h2>
                <div class="project-gallery">
                    <img src="images/Wandr Plan your trip.png" alt="Plan your trip feature">
                    <img src="images/Wandr Edit a day.png" alt="Edit a day feature">
                </div>
            </header>
            <p>Content</p>
        </article>

        <article>
            <!-- <header> is nested in <article> as this content has distinct information seperate from
                the pages overall header-->
            <header>
                <h2>STEM Student Wellbeing App</h2>
            </header>
            <p>Content</p>
        </article>
    </main>

    <!-- <footer> was used over <div> or <section> to indicate necessary miscellanous 
        information such as copyright for the 'works' page, not standard body content. -->
    <footer>
        &copy; 2026 Copyright
    </footer>
</body>
</html>
